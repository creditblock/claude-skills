<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparison</title>
<style>
  :root {
    --bg:#0c0c0e; --panel:#111114;
    --line:#1e1e24;
    --text:#e9e9ee; --muted:#a6a6af; --dim:#8a8a94; --faint:#6a6a72;
    --hover:#17171c;
    --link:#8f83f2; --link-hover:#a99ff6;
    --btn-line:#2a2a31; --btn-line-hover:#3a3a44;
    --kicker:#7f7f89;
    --st-yes:#3fb950; --st-partial:#f0a92c; --st-no:#6a6a72; --st-unknown:#55555d;
    --chip:#1c1c22; --ctl-on:rgba(124,108,240,.14);
  }
  :root[data-theme="light"] {
    --bg:#faf9f7; --panel:#ffffff;
    --line:#e9e6e1;
    --text:#1d1b17; --muted:#67625a; --dim:#8a847a; --faint:#a49d92;
    --hover:#f3f1ec;
    --link:#5a49c8; --link-hover:#4536b0;
    --btn-line:#ddd8cf; --btn-line-hover:#c8c2b6;
    --kicker:#8a847a;
    --st-yes:#1a7f37; --st-partial:#bf8700; --st-no:#a49d92; --st-unknown:#b8b1a5;
    --chip:#efece6; --ctl-on:rgba(90,73,200,.12);
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a { color:var(--link); text-decoration:none; }
  a:hover { color:var(--link-hover); text-decoration:underline; }
  svg { display:block; }
  #app { height:100vh; max-width:100%; display:flex; flex-direction:column; }

  .topbar { display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line); background:var(--panel); }
  .topbar .title { font-size:15px; font-weight:650; }
  .topbar .count { font-size:12px; color:var(--dim); }
  .spacer { flex-grow:1; }
  .tbtn { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; border:1px solid var(--btn-line); background:none; color:var(--muted); cursor:pointer; flex-shrink:0; }
  .tbtn:hover { color:var(--text); border-color:var(--btn-line-hover); }

  .controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 22px; border-bottom:1px solid var(--line); background:var(--panel); }
  .ctl { font:inherit; font-size:12px; color:var(--muted); background:none; border:1px solid var(--btn-line); border-radius:8px; padding:5px 10px; cursor:pointer; }
  .ctl:hover { color:var(--text); border-color:var(--btn-line-hover); }
  .ctl[aria-pressed="true"] { color:var(--text); border-color:var(--link); background:var(--ctl-on); }

  .scroller { flex:1 1 auto; min-height:0; overflow:auto; }
  table.matrix { border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; }
  table.matrix th, table.matrix td { border-bottom:1px solid var(--line); border-right:1px solid var(--line); text-align:left; vertical-align:top; }
  table.matrix th:last-child, table.matrix td:last-child { border-right:none; }

  thead th { position:sticky; top:0; z-index:3; background:var(--panel); }
  .corner { position:sticky; left:0; z-index:5; background:var(--panel); min-width:240px; width:240px; padding:12px 14px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--kicker); }
  .co { min-width:210px; padding:12px 14px; }
  .co .chead { display:flex; align-items:center; gap:9px; }
  .co .logo { width:24px; height:24px; border-radius:6px; object-fit:cover; flex-shrink:0; }
  .co .mono { width:24px; height:24px; border-radius:6px; display:grid; place-items:center; font-size:10px; font-weight:700; flex-shrink:0; }
  .co .cname { font-size:13px; font-weight:600; }
  a.cname { color: inherit; text-decoration: none; }
  a.cname:hover { text-decoration: underline; }
  .co .cnote { margin-top:5px; font-size:11px; color:var(--dim); line-height:1.4; }
  .co .score { margin-top:7px; display:inline-flex; align-items:center; font-size:11px; color:var(--muted); background:var(--chip); border-radius:999px; padding:2px 9px; }
  .co .score b { color:var(--text); font-weight:600; }

  tr.theme th { position:sticky; left:0; z-index:1; background:var(--bg); padding:0; }
  tr.theme .band { display:flex; align-items:center; gap:11px; padding:11px 14px; cursor:pointer; }
  tr.theme .tile { width:24px; height:24px; border-radius:7px; display:grid; place-items:center; color:#fff; flex-shrink:0; }
  tr.theme .tname { font-size:13px; font-weight:650; }
  tr.theme .tn { font-size:11px; color:var(--dim); }
  tr.theme .chev { margin-left:auto; color:var(--dim); transition:transform .12s ease; }
  tr.theme.collapsed .chev { transform:rotate(-90deg); }

  th.capname { position:sticky; left:0; z-index:1; background:var(--bg); min-width:240px; width:240px; padding:12px 14px; }
  th.capname .cn { font-size:13px; font-weight:500; }
  th.capname .hint { margin-top:3px; font-size:11px; color:var(--dim); line-height:1.4; }

  td.cell { padding:11px 14px; cursor:pointer; }
  td.cell:hover { background:var(--hover); }
  td.cell .row { display:flex; align-items:flex-start; gap:8px; }
  td.cell .mark { flex-shrink:0; margin-top:1px; }
  td.cell[data-status="yes"] .mark { color:var(--st-yes); }
  td.cell[data-status="partial"] .mark { color:var(--st-partial); }
  td.cell[data-status="no"] .mark { color:var(--st-no); }
  td.cell[data-status="unknown"] .mark { color:var(--st-unknown); }
  td.cell .note { font-size:12px; color:var(--muted); line-height:1.45; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  td.cell.open .note { -webkit-line-clamp:unset; }
  td.cell .detail { margin-top:7px; font-size:11.5px; }
  td.cell .detail a { display:inline-block; word-break:break-all; }

  tr.cap.hidden-theme { display:none; }
  table.matrix.diffonly tr.cap.same { display:none; }
  table.matrix.diffonly tr.theme.allsame { display:none; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = /*__COMPARE_JSON__*/;
const TITLE = DATA.title || DATA.companies.map(function (c) { return c.name; }).join(" · ");
document.title = TITLE + " — Comparison";

(function initTheme() {
  let t = null;
  try { t = localStorage.getItem("ptc-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    t = (DATA.theme === "light" || DATA.theme === "dark") ? DATA.theme : "dark";
  }
  if (t === "light") document.documentElement.setAttribute("data-theme", "light");
})();

const BANDS = [
  "linear-gradient(135deg,#d6336c,#f06595)",
  "linear-gradient(135deg,#e8590c,#f76707)",
  "linear-gradient(135deg,#f08c00,#f59f00)",
  "linear-gradient(135deg,#2f9e44,#40c057)",
  "linear-gradient(135deg,#1971c2,#3b82f6)",
  "linear-gradient(135deg,#7048e8,#9775fa)"
];
const TINTS = ["236,79,124", "240,118,54", "245,159,0", "64,192,87", "59,130,246", "151,117,250"];
const ICON_MOON = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/>';
const ICON_SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2 2M17.1 17.1l2 2M19.1 4.9l-2 2M4.9 19.1l2-2"/>';
const ICON_THEME = '<path d="M4 8l8-4 8 4-8 4-8-4Z"/><path d="M4 8v8l8 4 8-4V8"/>';
const ICON_CHEV = '<path d="M6 9l6 6 6-6"/>';
const MARKS = {
  yes: '<path d="M5 13l4 4L19 7"/>',
  partial: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/>',
  no: '<path d="M6 12h12"/>',
  unknown: '<path d="M9.2 9a2.8 2.8 0 1 1 3.8 2.6c-.9.4-1.2 1-1.2 1.9M12 17h.01"/>'
};

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  Object.assign(n, props || {});
  for (const k of kids) {
    if (k == null || k === false) continue;
    n.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return n;
}
function svg(paths, size) {
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size +
    '" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
}
function glyph(cls, paths, size, styles) {
  const s = el("span", { className: cls });
  Object.assign(s.style, styles || {});
  s.innerHTML = svg(paths, size);
  return s;
}
function logoNode(company, i) {
  const l = company.logo;
  if (typeof l === "string" && /^data:image\//.test(l)) {
    return el("img", { className: "logo", src: l, alt: "" });
  }
  const words = String(company.name || "").trim().split(/\s+/).filter(Boolean);
  const ini = (words.length >= 2 ? words[0][0] + words[1][0] : (words[0] || "?").slice(0, 2)).toUpperCase();
  const m = el("span", { className: "mono" }, ini);
  m.style.background = "rgba(" + TINTS[i % TINTS.length] + ",.18)";
  m.style.color = "rgb(" + TINTS[i % TINTS.length] + ")";
  return m;
}

const NAMES = DATA.companies.map(function (c) { return c.name; });

function scores() {
  const s = {};
  NAMES.forEach(function (n) { s[n] = { yes: 0, partial: 0 }; });
  (DATA.themes || []).forEach(function (t) {
    (t.capabilities || []).forEach(function (cap) {
      NAMES.forEach(function (n) {
        const st = (cap.cells[n] || {}).status;
        if (st === "yes") s[n].yes++;
        else if (st === "partial") s[n].partial++;
      });
    });
  });
  return s;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  const themes = DATA.themes || [];
  const capCount = themes.reduce(function (a, t) { return a + (t.capabilities || []).length; }, 0);
  const sc = scores();
  let table;

  const toggle = el("button", { className: "tbtn", title: "Toggle light / dark" });
  const paint = function () {
    const light = document.documentElement.getAttribute("data-theme") === "light";
    toggle.innerHTML = svg(light ? ICON_MOON : ICON_SUN, 16);
  };
  paint();
  toggle.onclick = function () {
    const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    if (next === "light") document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");
    try { localStorage.setItem("ptc-theme", next); } catch (e) {}
    paint();
  };
  app.append(el("div", { className: "topbar" },
    el("span", { className: "title" }, TITLE),
    el("span", { className: "count" }, NAMES.length + " companies · " + capCount + " capabilities"),
    el("span", { className: "spacer" }),
    toggle));

  const diffBtn = el("button", { className: "ctl" }, "Differences only");
  diffBtn.setAttribute("aria-pressed", "false");
  diffBtn.onclick = function () {
    const on = table.classList.toggle("diffonly");
    diffBtn.setAttribute("aria-pressed", on ? "true" : "false");
  };
  let allOpen = false;
  const expBtn = el("button", { className: "ctl" }, "Expand all");
  expBtn.onclick = function () {
    allOpen = !allOpen;
    table.querySelectorAll("td.cell").forEach(function (c) { c.classList.toggle("open", allOpen); });
    table.querySelectorAll("td.cell .detail").forEach(function (d) { d.classList.toggle("hidden", !allOpen); });
    expBtn.textContent = allOpen ? "Collapse all" : "Expand all";
  };
  const jump = el("select", { className: "ctl" });
  jump.append(el("option", { value: "" }, "Jump to theme…"));
  themes.forEach(function (t, i) { jump.append(el("option", { value: String(i) }, t.name)); });
  jump.onchange = function () {
    if (jump.value === "") return;
    const row = document.getElementById("theme-" + jump.value);
    if (row) row.scrollIntoView({ behavior: "smooth", block: "start" });
    jump.value = "";
  };
  app.append(el("div", { className: "controls" }, diffBtn, expBtn, jump));

  const scroller = el("div", { className: "scroller" });
  table = el("table", { className: "matrix", id: "matrix" });

  const thead = el("thead");
  const hr = el("tr", { className: "scorehead" });
  hr.append(el("th", { className: "corner" }, "Capability"));
  DATA.companies.forEach(function (c, i) {
    const th = el("th", { className: "co" });
    const nameEl = (typeof c.url === "string" && /^https?:\/\//i.test(c.url))
      ? el("a", { className: "cname", href: c.url, target: "_blank", rel: "noopener" }, c.name)
      : el("span", { className: "cname" }, c.name);
    th.append(el("div", { className: "chead" }, logoNode(c, i), nameEl));
    if (c.note) th.append(el("div", { className: "cnote" }, c.note));
    const chip = el("span", { className: "score" }, el("b", {}, String(sc[c.name].yes)), " yes");
    if (sc[c.name].partial) chip.append(" · " + sc[c.name].partial + " partial");
    th.append(chip);
    hr.append(th);
  });
  thead.append(hr);
  table.append(thead);

  const tbody = el("tbody");
  themes.forEach(function (t, ti) {
    const caps = t.capabilities || [];
    const trT = el("tr", { className: "theme", id: "theme-" + ti });
    const thT = el("th", { colSpan: NAMES.length + 1 });
    const band = el("div", { className: "band" },
      glyph("tile", ICON_THEME, 14, { background: BANDS[ti % BANDS.length] }),
      el("span", { className: "tname" }, t.name),
      el("span", { className: "tn" }, caps.length + (caps.length === 1 ? " capability" : " capabilities")),
      glyph("chev", ICON_CHEV, 16));
    band.onclick = function () {
      const collapsed = trT.classList.toggle("collapsed");
      tbody.querySelectorAll('tr.cap[data-theme="' + ti + '"]').forEach(function (r) {
        r.classList.toggle("hidden-theme", collapsed);
      });
    };
    thT.append(band);
    trT.append(thT);
    tbody.append(trT);

    caps.forEach(function (cap) {
      const tr = el("tr", { className: "cap" });
      tr.dataset.theme = String(ti);
      const nameTh = el("th", { className: "capname" }, el("div", { className: "cn" }, cap.name));
      if (cap.description) nameTh.append(el("div", { className: "hint" }, cap.description));
      tr.append(nameTh);

      const statuses = [];
      NAMES.forEach(function (n) {
        const cell = cap.cells[n] || { status: "unknown" };
        statuses.push(cell.status);
        const td = el("td", { className: "cell" });
        td.dataset.status = cell.status;
        const row = el("div", { className: "row" }, glyph("mark", MARKS[cell.status] || MARKS.unknown, 18));
        if (cell.note) row.append(el("span", { className: "note" }, cell.note));
        td.append(row);
        const detail = el("div", { className: "detail hidden" });
        if (cell.note) detail.append(el("div", {}, cell.note));
        if (cell.source && /^https?:\/\//i.test(cell.source)) {
          detail.append(el("a", { href: cell.source, target: "_blank", rel: "noopener" }, cell.source));
        }
        td.append(detail);
        td.onclick = function (e) {
          if (e.target.closest("a")) return;
          const open = td.classList.toggle("open");
          detail.classList.toggle("hidden", !open);
        };
        tr.append(td);
      });
      if (statuses.every(function (s) { return s === statuses[0]; })) tr.classList.add("same");
      tbody.append(tr);
    });

    const rows = Array.prototype.slice.call(tbody.querySelectorAll('tr.cap[data-theme="' + ti + '"]'));
    if (rows.length && rows.every(function (r) { return r.classList.contains("same"); })) {
      trT.classList.add("allsame");
    }
  });
  table.append(tbody);
  scroller.append(table);
  app.append(scroller);
}
render();
</script>
</body>
</html>
